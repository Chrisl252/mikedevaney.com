name = "mike-devaney-proxy"
compatibility_date = "2026-08-01"
main = "src/index.js"

routes = [
  { pattern = "mike-devaney.com/*", zone_name = "mike-devaney.com" },
  { pattern = "www.mike-devaney.com/*", zone_name = "mike-devaney.com" }
]

[[kv_namespaces]]
binding = "STATS_KV"
id = "31428c0f620040d0b329280fa53bbb71"

# Static site served directly by the Worker (no Pages, no proxy hop).
# Deploy: npm run deploy  (stages files into dist/ then `wrangler deploy`)
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

